name: TGG auto-poster

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes; posts anything due in autoposter/queue.json
  workflow_dispatch:
    inputs:
      only_id:
        description: "Post just this queue id now (for testing). Leave blank for normal run."
        required: false
        default: ""
      check:
        description: "Check only: verify token and that Meta can fetch every upcoming image/video. Publishes nothing."
        type: boolean
        default: false
      dry_run:
        description: "Dry run: log only, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post due items
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: "105927898387533"
          GRAPH_VERSION: "v23.0"
          ONLY_ID: ${{ inputs.only_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CHECK: ${{ inputs.check && '1' || '' }}
        run: python3 autoposter/post.py
      - name: Save posted log
        if: always()
        run: |
          git config user.name "tgg-autoposter"
          git config user.email "actions@users.noreply.github.com"
          git add autoposter/posted.json || true
          git diff --cached --quiet || (git commit -m "autoposter: update posted log" && git pull --rebase origin main && git push)
